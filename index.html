<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For Yassin 🖤</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff2e63">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=UnifrakturMaguntia&display=swap');
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
body{ background: radial-gradient(ellipse at top, #2a1018, #050505 70%); height:100vh; height:100dvh; overflow:hidden; font-family:'Cinzel',serif; color:#ffb3b3; display:flex; flex-direction:column; align-items:center; }
.top{ width:100%; max-width:420px; display:flex; justify-content:space-between; padding:14px 20px; font-size:14px; color:#ff6b8a; }
#sentence{ width:92%; max-width:400px; min-height:95px; background:rgba(0,0,0,0.55); border:1px dashed #ff2e6340; border-radius:18px; padding:14px 10px; text-align:center; margin-bottom:10px; font-family:'UnifrakturMaguntia'; font-size:20px; color:#ff8aa0; line-height:1.9; }
#sentence span{ opacity:0.18; transition:0.6s; margin:0 2px; display:inline-block; }
#sentence span.active{ opacity:1; color:#ff2e63; text-shadow:0 0 12px #ff2e63; transform:scale(1.1); }
#game{ position:relative; width:92%; max-width:420px; height:60vh; background:rgba(255,46,99,0.06); border:1px solid #ff2e6340; border-radius:24px; overflow:hidden; cursor:crosshair; }
.heart{ position:absolute; font-size:32px; cursor:pointer; user-select:none; animation:fall linear forwards; padding:18px; margin:-18px; }
@keyframes fall{ to{ transform:translateY(75vh) rotate(360deg); } }
.particle{ position:absolute; font-size:14px; pointer-events:none; animation:explode 0.8s ease-out forwards; }
@keyframes explode{ 0%{ transform:translate(0,0) scale(1); opacity:1; } 100%{ transform:translate(var(--x), var(--y)) scale(0); opacity:0; } }
.word-pop{ position:absolute; font-family:'UnifrakturMaguntia'; font-size:28px; color:#ff2e63; font-weight:bold; animation:pop 0.9s ease-out forwards; pointer-events:none; text-shadow:0 0 12px #ff2e63; }
@keyframes pop{ 0%{ transform:translateY(0) scale(0.3); opacity:0; } 40%{ opacity:1; } 100%{ transform:translateY(-70px) scale(1.4); opacity:0; } }
#scoreBox{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%); background:linear-gradient(90deg,#ff2e63,#8a0a2a); color:white; padding:16px 22px; border-radius:22px; font-weight:700; display:none; text-align:center; width:88%; z-index:10; }
.hint{ font-size:11px; color:#ff6b8a99; margin-top:6px; text-align:center; padding:0 10px;}
</style>
</head>
<body>
<div class="top"><div>🖤 <span id="score">0</span>/<span id="total"></span></div><div>⏳ <span id="time">60</span>s</div></div>
<div id="sentence"></div>
<div id="game"><div id="scoreBox"></div></div>
<div class="hint">كليكي على القلوب 🖤 • فـ PC بركي SPACE</div>
<script>
const fullSentence = ["When","you","go","I","wanna","go","with","you","and","when","you","die","I","wanna","die","with","you","🖤"];
document.getElementById('total').textContent = fullSentence.length;
const sentenceDiv=document.getElementById('sentence');
fullSentence.forEach((w,i)=>{ const s=document.createElement('span'); s.textContent=w; s.id='w-'+i; sentenceDiv.appendChild(s); });
let score=0, time=60, playing=true;
const game=document.getElementById('game');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const box=document.getElementById('scoreBox');
const melody = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 493.88, 440.00, 392.00, 349.23, 329.63, 392.00, 440.00, 523.25, 659.25, 783.99];
let audioCtx;
function getCtx(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function playNote(index){
  const ctx=getCtx(); const freq=melody[index % melody.length]; const osc=ctx.createOscillator(); const gain=ctx.createGain();
  osc.type='triangle'; osc.frequency.value=freq; gain.gain.setValueAtTime(0.25, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+1.2);
  osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+1.2);
}
function explodeEffect(x,y){
  const symbols=['🖤','✨','💖','🥀']; for(let i=0;i<8;i++){ const p=document.createElement('div'); p.className='particle'; p.textContent=symbols[Math.floor(Math.random()*symbols.length)]; p.style.left=x+'px'; p.style.top=y+'px'; const angle=Math.random()*Math.PI*2; const dist=40+Math.random()*70; p.style.setProperty('--x', Math.cos(angle)*dist+'px'); p.style.setProperty('--y', Math.sin(angle)*dist+'px'); game.appendChild(p); setTimeout(()=>p.remove(),800); }
}
function catchHeart(h, x, y){
  if(score>=fullSentence.length) return; explodeEffect(x,y); playNote(score); document.getElementById('w-'+score).classList.add('active'); const pop=document.createElement('div'); pop.className='word-pop'; pop.textContent=fullSentence[score]; pop.style.left=x+'px'; pop.style.top=y+'px'; game.appendChild(pop); setTimeout(()=>pop.remove(),900); score++; scoreEl.textContent=score; h.remove();
  if(score===fullSentence.length){ playing=false; setTimeout(()=>{ for(let i=0;i<fullSentence.length;i++) setTimeout(()=>playNote(i), i*120); }, 300); box.style.display='block'; box.innerHTML=`You completed us 🥀<br>"${fullSentence.join(' ')}"<br><br><button onclick="location.reload()" style="background:white;color:#ff2e63;border:none;padding:9px 22px;border-radius:20px;font-weight:700">Again ♡</button>`; }
}
function spawn(){
  if(!playing) return; const h=document.createElement('div'); h.className='heart'; h.textContent=['🖤','🥀','🌹'][Math.floor(Math.random()*3)]; h.style.left=Math.random()*85+'%'; h.style.top='-30px'; const isPC = window.innerWidth > 768; h.style.animationDuration = isPC? (5+Math.random()*2)+'s' : (3+Math.random()*2)+'s'; h.onclick=(e)=>{ const rect=game.getBoundingClientRect(); catchHeart(h, e.clientX-rect.left, e.clientY-rect.top); }; h.addEventListener('touchstart', (e)=>{ e.preventDefault(); const rect=game.getBoundingClientRect(); const t=e.touches[0]; catchHeart(h, t.clientX-rect.left, t.clientY-rect.top); }, {passive:false}); game.appendChild(h); setTimeout(()=>h.remove(), isPC?7000:5000);
}
setInterval(spawn, window.innerWidth>768?800:600);
document.addEventListener('keydown', (e)=>{ if(e.code==='Space'){ e.preventDefault(); const hearts=document.querySelectorAll('.heart'); if(hearts.length===0) return; let closest=hearts[0]; let maxY=-999; hearts.forEach(hh=>{ const y=hh.getBoundingClientRect().top; if(y>maxY){ maxY=y; closest=hh; } }); const rect=game.getBoundingClientRect(); const r=closest.getBoundingClientRect(); getCtx(); catchHeart(closest, r.left-rect.left+20, r.top-rect.top+20); } });
document.body.addEventListener('touchstart', ()=>{ getCtx(); }, {once:true});
setInterval(()=>{ if(!playing) return; time--; timeEl.textContent=time; if(time<=0 && score<fullSentence.length){ playing=false; box.style.display='block'; box.innerHTML=`Almost 🥀<br>${score}/${fullSentence.length}<br><br><button onclick="location.reload()" style="background:white;color:#ff2e63;border:none;padding:8px 20px;border-radius:20px">Try Again 🖤</button>`; } },1000);
</script>
</body>
</html>
